# Render Blueprint: New > Blueprint > pick this repo. Builds the Dockerfile on the free plan.
services:
  - type: web
    name: invoice-decisioning
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Render asks for the value once; it is stored as a secret
      - key: LLM_CACHE_MODE
        value: cached
